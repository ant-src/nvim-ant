name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [v0.11.4, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nvim-ant
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ant-src/ant
          path: ant
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mfussenegger/nvim-dap
          path: nvim-dap
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: build ant
        working-directory: ant
        run: go build -o "$RUNNER_TEMP/ant" ./cmd/ant
      - name: test
        working-directory: nvim-ant
        env:
          ANT_PATH: ${{ runner.temp }}/ant
          ANT_CORPUS: ${{ github.workspace }}/ant
          NVIM_DAP: ${{ github.workspace }}/nvim-dap
        run: tests/run.sh
